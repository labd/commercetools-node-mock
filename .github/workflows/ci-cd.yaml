name: validate

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate:
    name: Validate on Node ${{ matrix.node }} / ${{ matrix.os }} / ${{ matrix.storage-engine }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    strategy:
      matrix:
        # Full coverage on Linux, smoke test on Windows/macOS
        os: [ubuntu-latest]
        node: ["22.x", "24.x", "26.x"]
        storage-engine: [in-memory, sqlite]
        include:
          - os: windows-latest
            node: "26.x"
            storage-engine: in-memory
          - os: macOS-latest
            node: "26.x"
            storage-engine: in-memory
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      STORAGE_ENGINE: ${{ matrix.storage-engine }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: labd/gh-actions-typescript/pnpm-install@e7a21fb56b52bf2d91616e34f0bc3f4f9a821b62 # main
        with:
          node-version: ${{ matrix.node }}

      - name: Check formatting and typing
        run: pnpm check

      - name: Run tests
        run: pnpm test:ci

      - name: Run build
        run: pnpm build

  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.pull_request.draft == false
    permissions:
      id-token: write  
      contents: write
      pull-requests: write 
    environment: release
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    needs: validate
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: labd/gh-actions-typescript/pnpm-install@e7a21fb56b52bf2d91616e34f0bc3f4f9a821b62 # main

      - name: Run build
        run: pnpm build

      - name: Upgrade npm for trusted publishing
        run: npm i -g npm@^11.6.4

      - name: Create and publish versions
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        id: changesets
        with:
          # changesets/action v2 renamed every one of these inputs.
          pr-title: "Release new version"
          commit-message: "update version"
          publish-script: pnpm publish:ci
          version-script: pnpm publish:version
          # v2 pushes the release commit and tags through the GitHub API; the
          # git CLI path keeps the previous behaviour.
          push-with-git-cli: true
        env:
          NPM_CONFIG_PROVENANCE: true

  docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve newest release tag
        id: latest_tag
        shell: bash
        run: |
          TAG="$(git tag --points-at HEAD --sort=-v:refname | head -n 1)"
          if [ -z "$TAG" ]; then
            TAG="$(git tag --sort=-creatordate | head -n 1)"
          fi
          if [ -z "$TAG" ]; then
            echo "No git tags found after release" >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: labdigital/commercetools-mock-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.latest_tag.outputs.value }}
            type=raw,value=latest,enable=${{ !contains(steps.latest_tag.outputs.value, 'beta') }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
